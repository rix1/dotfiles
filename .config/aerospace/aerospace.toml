# AeroSpace, an i3-like tiling window manager for macOS.
# Guide:    https://nikitabobko.github.io/AeroSpace/guide
# Commands: https://nikitabobko.github.io/AeroSpace/commands

# Config version for compatibility and deprecations. Version 2 makes
# persistent-workspaces explicit instead of inferring it from the bindings.
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# Start AeroSpace at login
start-at-login = true

# Reload the config automatically when this file is saved
auto-reload-config = true

# Commands that run after AeroSpace startup: window borders (JankyBorders).
# See: https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
]

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 40

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when the focused monitor changes
# See: https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Leave apps hidden with cmd-h hidden
# See: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Workspaces that stay alive (and in the menu bar) even when they're empty:
# every workspace that has an alt-<key> binding below.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "C", "M", "V", "B", "N"]

# Per-app rules. AeroSpace runs the first callback whose `if` succeeds and skips
# the rest. Find an app's ID with `aerospace list-apps`.
# See: https://nikitabobko.github.io/AeroSpace/guide#on-window-detected-callback
on-window-detected = [
    # Do not auto-tile these apps
    { if = 'test %{app-bundle-id} = com.apple.finder', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = company.thebrowser.dia', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.sindresorhus.Dato', run = 'layout floating' },
    # Search browser: the small window that links from other apps open in has an
    # empty title. It floats on the workspace you clicked the link on, as long as the
    # link arrives through Link Router (the default browser) and not straight from macOS.
    # Keep this above the rule that sends Search's other windows to workspace 1.
    { if = "test %{app-bundle-id} = com.officecommun.search && test %{window-title} ~= '^$'", run = 'layout floating' },

    # Automatic workspace assignment
    { if = 'test %{app-bundle-id} = com.officecommun.search', run = 'move-node-to-workspace 1' },
    { if = 'test %{app-bundle-id} = dev.zed.Zed', run = 'move-node-to-workspace C' },
    { if = 'test %{app-bundle-id} = com.mitchellh.ghostty', run = ['layout floating', 'move-node-to-workspace 3'] },
    { if = 'test %{app-bundle-id} = com.spotify.client', run = 'move-node-to-workspace 4' },
    { if = 'test %{app-bundle-id} = com.linear', run = 'move-node-to-workspace 8' },
    { if = 'test %{app-bundle-id} = com.superhuman.electron', run = 'move-node-to-workspace 9' },
    # Reflect Dev (personal build)
    { if = 'test %{app-bundle-id} = app.reflect.desktop.dev', run = 'move-node-to-workspace 0' },
    { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = 'move-node-to-workspace N' },
]

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# A value can also be per monitor, see:
# https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        10
    outer.right =      10

# 'main' binding mode. Key and modifier names:
# https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.main.binding]

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#fullscreen
    ctrl-alt-enter = 'fullscreen'

    # Rectangle-style Larger/Smaller: resizes a floating window around its
    # centre; on a tiled window it does what alt-equal/alt-minus do.
    ctrl-alt-equal = 'exec-and-forget ~/.local/bin/aerospace-grow +80'
    ctrl-alt-minus = 'exec-and-forget ~/.local/bin/aerospace-grow -80'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -250'
    alt-equal = 'resize smart +250'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 0'
    alt-b = 'workspace B'
    alt-c = 'workspace C'
    alt-m = 'workspace M'
    alt-n = 'workspace N'
    alt-v = 'workspace V'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 0'
    alt-shift-b = 'move-node-to-workspace B'
    alt-shift-c = 'move-node-to-workspace C'
    alt-shift-m = 'move-node-to-workspace M'
    alt-shift-n = 'move-node-to-workspace N'
    alt-shift-v = 'move-node-to-workspace V'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

# 'service' binding mode, entered with alt-shift-semicolon.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
