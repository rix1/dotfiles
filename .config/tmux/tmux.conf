# Rebind detach from default Prefix+d to Prefix+x.
unbind-key -T prefix d
unbind-key -T prefix x
bind-key -T prefix x detach-client

# Enter copy (scroll) mode without prefix — handy on phone
bind-key -n F12 copy-mode

set -g mouse on

# Keep enough scrollback for tmux-resurrect pane-content saves.
set -g history-limit 100000

# Restore tmux sessions, windows, panes, layouts, working directories, and pane
# contents after restarting tmux or rebooting.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-dir '$HOME/.config/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run '~/.config/tmux/plugins/tpm/tpm'
